<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cocina Interactiva - Fase de Prueba</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #1e1107;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        /* CABECERA Y TEMPORIZADOR */
        #header-cocina {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            box-sizing: border-box;
            font-size: 16px;
            font-weight: bold;
        }
        #timer {
            color: #ff3333;
            font-size: 20px;
            background: rgba(255,0,0,0.1);
            padding: 3px 10px;
            border-radius: 6px;
            border: 2px solid #ff3333;
        }

        /* COCINA VACÍA DE FONDO Y ZONA CENTRAL */
        #cocina-fondo {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 380px;
            background: #8b5a2b; /* Tono de cocina/madera vacía */
            border-bottom: 6px solid #4a2e16;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* HORNO EN EL CENTRO */
        #horno-contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #374151;
            border: 4px solid #1f2937;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #puerta-horno {
            width: 110px;
            height: 90px;
            background: #111827;
            border: 3px solid #6b7280;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
        }
        .estado-horno-texto {
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .estado-abierto { background: #10b981; color: white; }
        .estado-cerrado { background: #ef4444; color: white; }

        /* MESA Y MOLDE */
        #mesa-trabajo {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #5c3a21;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #3d2314;
        }
        #molde {
            width: 70px;
            height: 70px;
            background: #d1d5db;
            border: 3px dashed #4b5563;
            border-radius: 50%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        #molde.lleno {
            border-style: solid;
            border-color: #f59e0b;
            background: #fef3c7;
        }

        /* CONTENEDOR DE BOTONES DINÁMICOS */
        #panel-botones {
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }
        .btn-accion {
            background: #f59e0b;
            color: #111827;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
        }
        .btn-accion:active { transform: scale(0.95); }

        /* CINTA TRANSPORTADORA ABAJO CON BASURERO AL FINAL */
        #cinta-contenedor {
            width: 100%;
            height: 80px;
            background: #111827;
            border-top: 4px solid #374151;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        #banda-movil {
            position: absolute;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(90deg, #4b5563, #4b5563 20px, #1f2937 20px, #1f2937 40px);
            bottom: 0;
        }
        .ingrediente-cinta {
            position: absolute;
            font-size: 36px;
            cursor: pointer;
            animation: moverCinta 3s linear infinite;
            z-index: 10;
        }
        @keyframes moverCinta {
            from { transform: translateX(-50px); }
            to { transform: translateX(820px); }
        }
        #basurero-final {
            position: absolute;
            right: 0;
            top: 0;
            width: 70px;
            height: 100%;
            background: #4b5563;
            border-left: 3px solid #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            z-index: 15;
        }

        /* PANEL DE PREMIOS */
        #panel-premios {
            width: 100%;
            max-width: 800px;
            background: #111827;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            border-top: 2px solid #374151;
        }

        /* MODAL EXPIRADO */
        #modal-expirado {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- CABECERA -->
    <div id="header-cocina">
        <span>👨‍🍳 Cocina: Receta #5 (Pai de Manzana)</span>
        <div id="timer">05:00</div>
    </div>

    <!-- COCINA VACÍA Y ZONA CENTRAL -->
    <div id="cocina-fondo">
        
        <!-- HORNO EN EL CENTRO -->
        <div id="horno-contenedor">
            <span style="font-size: 11px; font-weight: bold; color: #9ca3af; margin-bottom: 3px;">HORNO</span>
            <div id="puerta-horno" onclick="togglePuertaHorno()">
                <span id="icono-horno">🚪</span>
            </div>
            <div id="txt-estado-horno" class="estado-horno-texto estado-cerrado">Cerrado</div>
        </div>

        <!-- MESA Y MOLDE -->
        <div id="mesa-trabajo">
            <div style="font-size: 13px; font-weight: bold;">Mesa de trabajo:</div>
            <div id="molde" title="Molde de ingredientes">🥣</div>
        </div>

        <!-- BOTONES DINÁMICOS DE CONTROL -->
        <div id="panel-botones">
            <button id="btn-poner-molde" class="btn-accion" onclick="ponerMoldeEnHorno()">Poner molde en el horno</button>
            <button id="btn-encender" class="btn-accion" onclick="encenderHorno()">Encender horno</button>
            <button id="btn-sacar-pie" class="btn-accion" onclick="sacarPieHorno()">Sacar Pai del horno</button>
            <button id="btn-empaquetar" class="btn-accion" onclick="empaquetarCaja()">📦 Empaquetar en caja y reclamar</button>
        </div>

    </div>

    <!-- CINTA TRANSPORTADORA CON BASURERO AL FINAL -->
    <div id="cinta-contenedor">
        <div id="banda-movil"></div>
        <div id="basurero-final" title="Basurero" onclick="vaciarMolde()">🗑️</div>
    </div>

    <!-- PANEL INFERIOR DE PREMIOS -->
    <div id="panel-premios">
        🎁 Premios: <span id="lista-premios">Ninguno aún</span>
    </div>

    <!-- MODAL EXPIRADO -->
    <div id="modal-expirado">
        <h2 style="color: #ff3333; font-size: 26px;">¡Pase Expirado!</h2>
        <p style="font-size: 16px; max-width: 350px;">Lo sentimos tu pass expiró compra otro para continuar de nuevo.</p>
        <button style="background:#10b981; color:white; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="location.reload()">Renovar Pase</button>
    </div>

    <script>
        // ESTADO GLOBAL
        let tiempoRestante = 300; // 5 minutos
        let ingredientesMolde = [];
        let estadoPuerta = "cerrado"; // "abierto" o "cerrado"
        let ubicacionMolde = "mesa"; // "mesa", "horno", "horneando", "listo"
        let tiempoHorno = 20;
        let intervaloHornoTimer = null;
        let premios = [];

        const ingredientesPosibles = ["🍎", "🥛", "🌾", "🧂"]; // Manzana, leche, trigo, azúcar/sal

        // 1. TEMPORIZADOR DE 5 MINUTOS
        const timerInterval = setInterval(() => {
            tiempoRestante--;
            let m = Math.floor(tiempoRestante / 60);
            let s = tiempoRestante % 60;
            document.getElementById('timer').innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
            if (tiempoRestante <= 0) {
                clearInterval(timerInterval);
                document.getElementById('modal-expirado').style.display = 'flex';
            }
        }, 1000);

        // 2. CINTA TRANSPORTADORA (Sale un ingrediente cada 3 segundos)
        setInterval(() => {
            if (tiempoRestante <= 0) return;
            generarIngrediente();
        }, 3000);

        function generarIngrediente() {
            const cinta = document.getElementById('cinta-contenedor');
            const item = ingredientesPosibles[Math.floor(Math.random() * ingredientesPosibles.length)];
            
            const div = document.createElement('div');
            div.className = 'ingrediente-cinta';
            div.innerText = item;
            div.style.top = '15px';
            
            // Al hacer clic, se agrega al molde (si está en la mesa)
            div.onclick = (e) => {
                e.stopPropagation();
                if (ubicacionMolde === "mesa") {
                    agregarIngredienteMolde(item);
                    div.remove();
                } else {
                    alert("¡El molde no está en la mesa!");
                }
            };

            cinta.appendChild(div);
            setTimeout(() => { if (div.parentNode) div.remove(); }, 3000);
        }

        // LÓGICA DEL MOLDE Y INGREDIENTES
        function agregarIngredienteMolde(item) {
            if (ingredientesMolde.length >= 4) {
                alert("El molde ya tiene 4 ingredientes.");
                return;
            }
            ingredientesMolde.push(item);
            actualizarInterfaz();
        }

        function vaciarMolde() {
            if (ubicacionMolde === "mesa") {
                ingredientesMolde = [];
                actualizarInterfaz();
            }
        }

        // 3. ABRIR Y CERRAR HORNO INFINITAMENTE
        function togglePuertaHorno() {
            const puerta = document.getElementById('puerta-horno');
            const txtEstado = document.getElementById('txt-estado-horno');
            const icono = document.getElementById('icono-horno');

            if (estadoPuerta === "cerrado") {
                estadoPuerta = "abierto";
                txtEstado.innerText = "Abierto";
                txtEstado.className = "estado-horno-texto estado-abierto";
                
                if (ubicacionMolde === "horneando") {
                    icono.innerText = "🔥🥧";
                } else if (ubicacionMolde === "listo") {
                    icono.innerText = "🛎️🥧";
                } else if (ubicacionMolde === "horno") {
                    icono.innerText = "🥣";
                } else {
                    icono.innerText = "🔓";
                }
            } else {
                estadoPuerta = "cerrado";
                txtEstado.innerText = "Cerrado";
                txtEstado.className = "estado-horno-texto estado-cerrado";
                icono.innerText = "🚪";
            }
            actualizarInterfaz();
        }

        // 4. BOTONES Y FLUJO DE ACCIONES
        function actualizarInterfaz() {
            const moldeDiv = document.getElementById('molde');
            
            // Visual del molde en la mesa
            if (ubicacionMolde === "mesa") {
                if (ingredientesMolde.length === 0) {
                    moldeDiv.innerHTML = "🥣";
                    moldeDiv.classList.remove('lleno');
                } else {
                    moldeDiv.innerHTML = ingredientesMolde.join(' ');
                    moldeDiv.classList.add('lleno');
                }
            } else {
                moldeDiv.innerHTML = "🥣 (En horno)";
                moldeDiv.classList.remove('lleno');
            }

            // GESTIÓN DE BOTONES VISIBLES SEGÚN REGLAS
            const btnPonerMolde = document.getElementById('btn-poner-molde');
            const btnEncender = document.getElementById('btn-encender');
            const btnSacarPie = document.getElementById('btn-sacar-pie');
            const btnEmpaquetar = document.getElementById('btn-empaquetar');

            // Regla: Molde con 4 ingredientes en la mesa + horno abierto -> Mostrar "Poner molde en el horno"
            if (ingredientesMolde.length === 4 && ubicacionMolde === "mesa" && estadoPuerta === "abierto") {
                btnPonerMolde.style.display = "block";
            } else {
                btnPonerMolde.style.display = "none";
            }

            // Regla: Molde dentro del horno + horno cerrado -> Mostrar "Encender horno"
            if (ubicacionMolde === "horno" && estadoPuerta === "cerrado") {
                btnEncender.style.display = "block";
            } else {
                btnEncender.style.display = "none";
            }

            // Regla: Horno listo (pasaron 20s) + horno abierto -> Mostrar "Sacar Pai del horno"
            if (ubicacionMolde === "listo" && estadoPuerta === "abierto") {
                btnSacarPie.style.display = "block";
            } else {
                btnSacarPie.style.display = "none";
            }

            // Regla: Después de sacar el pie -> Mostrar botón de caja y flecha
            if (ubicacionMolde === "fuera-horno") {
                btnEmpaquetar.style.display = "block";
            } else {
                btnEmpaquetar.style.display = "none";
            }
        }

        function ponerMoldeEnHorno() {
            if (estadoPuerta !== "abierto") {
                alert("¡El horno debe estar abierto para meter el molde!");
                return;
            }
            ubicacionMolde = "horno";
            document.getElementById('icono-horno').innerText = "🥣";
            alert("Molde colocado dentro del horno. ¡Cierra la puerta para encender!");
            actualizarInterfaz();
        }

        function encenderHorno() {
            if (estadoPuerta !== "cerrado") {
                alert("¡El horno debe estar cerrado para encenderse!");
                return;
            }
            ubicacionMolde = "horneando";
            tiempoHorno = 20;
            document.getElementById('txt-estado-horno').innerText = "Horneando...";
            
            alert("🔥 Horno encendido. Espera 20 segundos...");

            intervaloHornoTimer = setInterval(() => {
                tiempoHorno--;
                if (tiempoHorno <= 0) {
                    clearInterval(intervaloHornoTimer);
                    ubicacionMolde = "listo";
                    document.getElementById('txt-estado-horno').innerText = "¡Listo!";
                    reproducirTinTin();
                }
            }, 1000);
            
            actualizarInterfaz();
        }

        function reproducirTinTin() {
            try {
                let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play();
            } catch(e) {}
            alert("🛎️ ¡Tin tin! El Pai de manzana está horneado. Abre el horno.");
        }

        function sacarPieHorno() {
            ubicacionMolde = "fuera-horno";
            document.getElementById('icono-horno').innerText = "🚪";
            alert("🥧 ¡Has sacado el Pai horneado del horno!");
            actualizarInterfaz();
        }

        function empaquetarCaja() {
            ubicacionMolde = "mesa";
            ingredientesMolde = [];
            
            let premio = "🐾 Pet Rara (Gato Pastelero)";
            premios.push(premio);
            document.getElementById('lista-premios').innerText = premios.join(', ');
            
            alert(`📦 ¡Pai metido en la caja con éxito!\nHas ganado: ${premio}`);
            actualizarInterfaz();
        }
    </script>
</body>
          </html>
